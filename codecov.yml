codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "60...80"

  status:
    project:
      default:
        target: auto
        threshold: 1%
        if_ci_failed: error
    patch:
      default:
        target: 80%
        threshold: 0%

ignore:
  - "cmd/"
  - "internal/store/dbgen/" # Auto generatred sqlc code
  - "internal/telemetrytest/"

flags:
  unittests:
    paths:
      - "internal/"
    carryforward: true

  integration:
    paths:
      - "internal/store/"
    carryforward: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
